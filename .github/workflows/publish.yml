name: Publish to npm

# Runs when a vX.Y.Z tag is pushed. Bump "version" in package.json and add a
# CHANGELOG.md entry first; the tag must match the version.
#
# Publishes with npm trusted publishing (OIDC, no token) and provenance. The
# workflow filename and the `npm` environment are bound to the trusted-publisher
# config on npmjs.com; renaming either breaks publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 required for trusted publishing
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci

      - name: Typecheck, lint, test, build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run typecheck:examples
          npm run smoke

      - name: Publish
        run: npm publish --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md"
